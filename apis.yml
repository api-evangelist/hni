    description: >-
      The Hearth & Home Technologies storefront implements the Universal Commerce Protocol (UCP) over an
      anonymous Model Context Protocol endpoint. A tools/list probe on 2026-09-13 returned 13 tools —
      search_catalog, lookup_catalog, get_product, get_cart, create_cart, update_cart, cancel_cart,
      get_checkout, create_checkout, update_checkout, complete_checkout, cancel_checkout and get_order —
      each with a full JSON Schema inputSchema. Tool discovery is anonymous; tool execution requires a
      fetchable UCP agent profile URI and a Shopify agent JWT. The runtime is Shopify's platform UCP
      implementation served on HNI's own brand host against HNI's own catalog.
