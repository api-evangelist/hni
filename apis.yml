description: >-
  HNI Corporation (NYSE: HNI) is a manufacturer founded in 1944 and headquartered in Muscatine, Iowa,
  built around two operating segments. Workplace Furnishings makes office seating, desks, storage,
  tables, panel systems and ancillary furnishings sold through independent dealers under the HON,
  Allsteel, Gunlocke, HBF and Kimball International brands. Residential Building Products is the hearth
  business, operated by Hearth & Home Technologies under the Heatilator, Heat & Glo, Majestic, Monessen,
  Quadra-Fire, Harman, SimpliFire and PelPro brands. HNI publishes no developer portal, REST API or
  OpenAPI for either segment. Its one public machine-readable surface is the agent-commerce stack on the
  Hearth & Home Technologies storefront at hearthnhome.com, which serves an llms.txt, a Universal
  Commerce Protocol merchant profile and an anonymous MCP endpoint exposing 13 catalog, cart and
  checkout tools.
