  - dev.ucp.shopping.order
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
constraints:
  - Checkout requires contemporaneous human approval; agents must not complete payment without explicit
    buyer consent (stated in llms.txt).
  - The MCP endpoint is rate-limited per IP; back off on 429 (stated in llms.txt).
  - Every tools/call requires a `meta.ucp-agent.profile` URI that the server fetches over HTTP before
    dispatch; an unreachable profile is rejected with -32001 profile_unreachable.
  - tools/call additionally requires a Shopify agent JWT.
  - complete_checkout accepts `meta.idempotency-key`; no other mutating tool does.
  - There is no refund, void or reverse tool — a completed checkout cannot be undone through this API.
tool_crosswalk: null
tool_crosswalk_note: >-
  No tool crosswalk was written: HNI publishes no OpenAPI and no GraphQL endpoint, so there is nothing to
  bind the MCP tools to. The crosswalk is emitted only when a second contract surface exists.
